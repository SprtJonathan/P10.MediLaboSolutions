services:

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - medilabo-network

  medilabosolutions.api:
    image: ${DOCKER_REGISTRY-}medilabosolutionsapi
    container_name: api
    build:
      context: .
      dockerfile: MediLaboSolutions.API/Dockerfile
    ports:
      - "8081:80"
    environment:
      - ASPNETCORE_URLS=http://*:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MediLaboSolutions;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False
    depends_on:
      - sqlserver
    command: ["sh", "-c", "until nc -z sqlserver 1433; do sleep 1; done; dotnet MediLaboSolutions.API.dll"]
    networks:
      - medilabo-network

  medilabosolutions.evaluation:
    image: ${DOCKER_REGISTRY-}medilabosolutionsevaluation
    build:
      context: .
      dockerfile: MediLaboSolutions.Evaluation/Dockerfile
    ports:
      - "8082:80"
    environment:
      - ASPNETCORE_URLS=http://*:80
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - medilabo-network

  medilabosolutions.gateway:
    image: ${DOCKER_REGISTRY-}medilabosolutionsgateway
    build:
      context: .
      dockerfile: MediLaboSolutions.Gateway/Dockerfile
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_URLS=http://*:80
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - medilabo-network

  medilabosolutions.notes:
    image: ${DOCKER_REGISTRY-}medilabosolutionsnotes
    build:
      context: .
      dockerfile: MediLaboSolutions.Notes/Dockerfile
    ports:
      - "8083:80"
    environment:
      - ASPNETCORE_URLS=http://*:80
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoSettings__ConnectionString=mongodb://mongodb:27017
      - MongoSettings__DatabaseName=MediLaboSolutions
    depends_on:
      - mongodb
    networks:
      - medilabo-network

  medilabosolutions.web:
    image: ${DOCKER_REGISTRY-}medilabosolutionsweb
    container_name: frontend
    build:
      context: .
      dockerfile: MediLaboSolutions.Web/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_URLS=http://*:80
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=MediLaboSolutions;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=False
    depends_on:
      - sqlserver
    networks:
      - medilabo-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=true
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - 1433:1433
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - medilabo-network

  database-seed:
    build:
      context: .
      dockerfile: db-init/Dockerfile
    container_name: database-seed
    depends_on:
      - sqlserver
    networks:
      - medilabo-network

networks:
  medilabo-network:
    driver: bridge

volumes:
  sqlserver-data: